# The workflow Lesson 11 reads. Two jobs on purpose:
#
#   e2e     — the suite itself, split across two runners with --shard, each
#             writing a machine-readable blob report instead of HTML.
#   report  — merges those blobs back into ONE html report and uploads it,
#             because two shards produce two partial reports and neither of
#             them is the answer to "did the suite pass?".
name: playwright

# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      # Without this, one failing shard cancels the other and you lose half
      # the picture — the opposite of what a report is for.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A runner has no browsers and none of the system libraries they need;
      # --with-deps installs both. This is the step a Playwright job has that
      # a lint/build job doesn't.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The config's own webServer starts `npm run dev` here — no separate
      # "start the app" step needed, and process.env.CI flips retries,
      # forbidOnly and headless (see playwright.config.ts).
      - name: Run e2e tests (shard ${{ matrix.shard }} of 2)
        run: npx playwright test --shard=${{ matrix.shard }}/2 --reporter=blob

      # if: always() — the report matters *most* when the step above failed.
      - name: Upload this shard's blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  report:
    # always() so a failed suite still produces a readable report, and
    # needs: so it only runs once both shards are done.
    if: always()
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download every shard's blob report
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: all-blob-reports

      - name: Merge them into one HTML report
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload the merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lessons:
    # The course's own tests, unsharded — the plain shape of a Playwright job,
    # next to the sharded one above for contrast. Unsolved homework is
    # test.fixme()'d, so it reports as skipped rather than failing the run.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the course's demos and finished homework
        run: npm run test:lessons -- --reporter=github

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lessons-report
          path: playwright-report/
          retention-days: 7
